server {
    listen 3000;
    server_name _;
    client_max_body_size 35m;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Generated at container startup. Authentication remains disabled when
    # CANVAS_AUTH_USER and CANVAS_AUTH_PASSWORD are both unset.
    include /etc/nginx/canvas-auth.conf;

    # Coolify probes this endpoint without credentials during rolling updates.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The /assets SPA page shares its name with Vite's output directory.
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Same-origin gateway to the Coolify Codex Worker. The real token is
    # injected server-side by nginx and is never shipped to browser JavaScript.
    location /agent/ {
        proxy_pass https://codex-worker.yiswim.cloud/canvas-agent/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host codex-worker.yiswim.cloud;
        proxy_set_header X-Canvas-Agent-Token "${CANVAS_AGENT_TOKEN}";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
